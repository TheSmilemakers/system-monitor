name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# One run per ref; a newer push cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The app targets macOS system tooling (top, vm_stat, sysctl, lsof, pmset).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned through package.json "packageManager" so local and CI agree.
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run check` is the single source of truth for what "green" means.
      # It runs: typecheck, lint (zero warnings), tests, production dependency
      # audit (hard fail), build, smoke against the production server, smoke
      # against the dev server, and every QA gate phase at 10/10.
      - name: Full check (same command as local)
        run: bun run check

      # The full tree audit includes the eslint tool chain; it is reported, not gated.
      - name: Full dependency audit (report only)
        if: always()
        run: |
          {
            echo '## Full dependency audit (dev tree included, informational)'
            echo '```'
            bun audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
