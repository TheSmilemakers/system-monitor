name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    # The app targets macOS system tooling (top, vm_stat, sysctl, lsof, pmset).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (zero warnings)
        run: bunx eslint --max-warnings=0

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Dependency audit
        run: bun audit --audit-level=high || true

      - name: QA gates (all phases, 10/10 required)
        run: node scripts/qa-gate.mjs all
